# 배포는 이 워크플로가 하지 않는다.
#
# 실제 배포 경로는 Vercel GitHub Integration 단일 경로다
#   main push       → Production
#   브랜치 / PR     → Preview
# 과거 이 파일은 `vercel pull/build/deploy` 로 같은 커밋을 한 번 더 배포했고,
# VERCEL_TOKEN 만료 이후 계속 실패하고 있었다. 토큰만 갱신하면 production 이
# 이중으로 배포되는 구조라, 배포 스텝을 제거하고 CI 검증 전용으로 교체했다.
#
# 따라서 여기서는 main 에 들어가기 전에 타입·테스트·린트만 막는다.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 같은 ref 에 연속 푸시가 나면 앞선 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json 의 packageManager 필드에서 온다 (version 미지정).
      # 의존성 설치는 아래 Install 스텝에서 — setup-node 가 Node 버전을 잡은 뒤에 한다.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          # package.json engines.node 및 Vercel 프로젝트 nodeVersion(24.x)과 동일하게 유지.
          node-version: '24'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # tsc 전용 스크립트는 두지 않는다 — 로컬 관행(`npx tsc --noEmit`)과 동일 명령.
      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test:run

      - name: Lint
        run: pnpm lint
